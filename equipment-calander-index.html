<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Availability Calendar</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="equipment-calender-style.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <h3>LAB PLATFORM</h3>
            </div>

            <ul>

                <li>
                    <i class="fa-solid fa-table-columns"></i>
                    Dashboard
                </li>

                <li class="active">
                    <i class="fa-solid fa-microscope"></i>
                    Equipment
                </li>

                <li>
                    <i class="fa-solid fa-calendar-check"></i>
                    Bookings
                </li>

                <li>
                    <i class="fa-solid fa-share-nodes"></i>
                    Sharing
                </li>

                <li>
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Maintenance
                </li>

                <li>
                    <i class="fa-solid fa-chart-column"></i>
                    Analytics
                </li>

                <li>
                    <i class="fa-solid fa-bell"></i>
                    Notifications
                </li>

            </ul>

        </aside>

        <main class="main">

            <header class="header">

                <h2>Equipment availability calendar</h2>

                <div class="header-right">

                    <div class="search">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="text" id="searchBox" placeholder="Search...">

                    </div>

                    <div class="profile"></div>

                </div>

            </header>

            <section class="toolbar">

                <input type="text" id="filterEquipment" placeholder="Filter equipment">

                <div class="week-navigation">

                    <button id="prevWeek">
                        <i class="fa-solid fa-angle-left"></i>
                        Week
                    </button>

                    <span id="weekLabel">
                        22–28 Jul 2026
                    </span>

                    <button id="nextWeek">
                        Week
                        <i class="fa-solid fa-angle-right"></i>
                    </button>

                </div>

            </section>

            <section class="calendar">

                <div class="calendar-header">

                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                    <div>Sun</div>

                </div>

                <div class="calendar-grid">

                    <div class="day">

                        <div class="event blue"
                            style="top:50px;">

                            Rao — Microscope

                        </div>

                    </div>

                    <div class="day">

                        <div class="event blue"
                            style="top:115px;">

                            Iyer — HPLC

                        </div>

                    </div>

                    <div class="day">

                        <div class="event orange"
                            style="top:250px;">

                            Lab maint.

                        </div>

                    </div>

                    <div class="day">

                        <div class="event blue"
                            style="top:75px;">

                            Singh — UV-Vis

                        </div>

                    </div>

                    <div class="day">

                        <div class="event blue"
                            style="top:180px;">

                            Rao — Microscope

                        </div>

                    </div>

                    <div class="day">

                        <div class="event blue"
                            style="top:145px;">

                            Open slot

                        </div>

                    </div>

                    <div class="day">

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="equipment-calender-script.js"></script>

</body>

</html>

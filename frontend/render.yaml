# Render Blueprint for the frontend static site.
# Optional: you can configure the same settings manually in the Render Dashboard.
# If your repo has the frontend inside a subfolder, uncomment rootDir below.
services:
  - type: web
    runtime: static
    name: lab-resource-frontend
    # rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # set the real backend URL in the Render Dashboard
    routes:
      # SPA fallback: the app uses its own pathname-based router, so every
      # unknown path must serve index.html (Render only applies this when no
      # real file exists at that path, so /assets/* is unaffected).
      - type: rewrite
        source: /*
        destination: /index.html

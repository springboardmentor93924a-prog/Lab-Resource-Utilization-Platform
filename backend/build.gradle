plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// java {
// 	toolchain {
// 		languageVersion = JavaLanguageVersion.of(21)
// 	}
// }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Spring Boot 4 defaults to Jackson 3 (package tools.jackson.*), but
	// EmailService and GoogleTokenVerifier use the classic Jackson 2 API
	// (com.fasterxml.jackson.databind.ObjectMapper/JsonNode) - as does
	// the jjwt-jackson dependency below. spring-boot-jackson2 is Spring's
	// official (deprecated-but-supported) compatibility module that puts
	// Jackson 2 back on the classpath without touching any code.
	implementation 'org.springframework.boot:spring-boot-jackson2'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Module 7 - Email notifications. Free: works with Gmail SMTP + an
	// App Password, no paid service (Twilio/Firebase deliberately not
	// added - those cost money / need a phone number).
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	//newly added lines for authentication
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	//upto above lines
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	// Task 5 - Utilization & Cost Reports: PDF and Excel export.
	// OpenPDF (LGPL/MPL, actively maintained iText 4 fork) gives a
	// simple high-level table API; Apache POI is the standard for
	// .xlsx generation. Both are widely used, stable libraries -
	// no new architecture, just two report-rendering dependencies.
	implementation 'com.github.librepdf:openpdf:1.3.42'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Equipment</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="book-equipment-style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            LAB PLATFORM
        </div>

        <ul>

            <li>Dashboard</li>

            <li>Equipment</li>

            <li class="active">
                Bookings
            </li>

            <li>Sharing</li>

            <li>Maintenance</li>

            <li>Analytics</li>

            <li>Notifications</li>

        </ul>

    </aside>

    <main class="main">

        <header class="topbar">

            <h2>Book equipment</h2>

            <div class="top-right">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                    placeholder="Search...">

                </div>

                <div class="profile"></div>

            </div>

        </header>

        <div class="close-row">

            <button class="close-btn">

                ×

            </button>

        </div>

        <div class="equipment-card">

            Confocal microscope — Room B1,
            Biology dept

        </div>

        <section class="booking-section">

            <div class="form-row">

                <div class="input-group">

                    <label>Date</label>

                    <input
                    type="date">

                </div>

                <div class="input-group">

                    <label>Start time</label>

                    <input
                    type="time"
                    value="10:00">

                </div>

                <div class="input-group">

                    <label>Duration</label>

                    <select>

                        <option>2 hours</option>
                        <option>1 hour</option>
                        <option>3 hours</option>
                        <option>4 hours</option>

                    </select>

                </div>

            </div>

            <div class="recurring">

                <label>

                    <input type="checkbox">

                    Recurring booking?

                </label>

                <label>

                    Repeat weekly for

                </label>

                <input
                type="number"
                value="4">

                <span>wks</span>

            </div>

            <div class="notes">

                <label>

                    Purpose / notes

                </label>

                <textarea></textarea>

            </div>

        </section>

        <section class="availability">

            <h3>

                Availability preview

            </h3>

            <div class="slots">

                <div class="slot free">

                    <p>9:00-10:00</p>

                    <span>Free</span>

                </div>

                <div class="slot free">

                    <p>10:00-11:00</p>

                    <span>Free</span>

                </div>

                <div class="slot conflict">

                    <p>11:00-12:00</p>

                    <span>Conflict</span>

                </div>

                <div class="slot free">

                    <p>12:00-1:00</p>

                    <span>Free</span>

                </div>

            </div>

        </section>

        <div class="buttons">

            <button class="waitlist">

                Join waitlist

            </button>

            <button class="cancel">

                Cancel

            </button>

            <button class="next">

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </div>

    </main>

</div>

<script src="book-equipment-script.js"></script>

</body>
</html>

services:
  # Spring Boot backend
  - type: web
    name: lab-resource-utilization-backend
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # Automatically use the live frontend URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: lab-resource-utilization-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # React/Vite frontend
  - type: web
    name: lab-resource-utilization-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      # Automatically use the live backend URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: lab-resource-utilization-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
server:
  port: ${PORT:8081}

spring:
  application:
    name: lab-resource-platform

  profiles:
    active: postgres   # switch to "h2" for a zero-install quick start

  datasource:
    url: jdbc:postgresql://localhost:5432/lab_platform
    username: labadmin
    password: labpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSecretKeyInProductionEnvironmentMinimum256BitsLong}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: http://localhost:5173
  storage:
    local-path: ./uploads
  notifications:
    sms-enabled: false     # Twilio not configured — flip on after adding credentials
    push-enabled: false    # Firebase not configured — flip on after adding credentials
    email-enabled: true

logging:
  level:
    com.labplatform: INFO
    org.springframework.security: WARN

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Equipment</title>

    <link rel="stylesheet" href="add-equipment-style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            <h3>LAB PLATFORM</h3>
        </div>

        <ul>

            <li>Dashboard</li>

            <li class="active">
                Equipment
            </li>

            <li>Bookings</li>

            <li>Sharing</li>

            <li>Maintenance</li>

            <li>Analytics</li>

            <li>Notifications</li>

        </ul>

    </aside>

    <main class="main">

        <header>

            <h2>Add equipment</h2>

            <div class="right">

                <input
                type="text"
                placeholder="Search...">

                <div class="profile">
                    <i class="fa-solid fa-user"></i>
                </div>

            </div>

        </header>

        <div class="card">

            <button class="close-btn">
                ×
            </button>

            <div class="section">

                <h3>Basic info</h3>

                <div class="grid-3">

                    <div>

                        <label>Equipment name</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Category / type</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Asset ID / tag</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Department</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Institution</label>

                        <input
                        type="text">

                    </div>

                </div>

            </div>

            <div class="section">

                <h3>Specifications</h3>

                <div class="grid-3">

                    <div>

                        <label>Manufacturer</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Model number</label>

                        <input
                        type="text">

                    </div>

                    <div>

                        <label>Capacity / notes</label>

                        <textarea></textarea>

                    </div>

                </div>

            </div>

            <div class="section">

                <h3>Documents</h3>

                <div class="documents">

                    <div class="upload-box">

                        <i class="fa-solid fa-cloud-arrow-up"></i>

                        <p>Upload manual (PDF)</p>

                        <input type="file">

                    </div>

                    <div class="upload-box">

                        <i class="fa-solid fa-cloud-arrow-up"></i>

                        <p>Upload calibration certificate</p>

                        <input type="file">

                    </div>

                </div>

            </div>

            <div class="section">

                <h3>Status</h3>

                <div class="status">

                    <button class="pill active-status">
                        Available
                    </button>

                    <button class="pill">
                        Booked
                    </button>

                    <button class="pill">
                        Under maintenance
                    </button>

                    <button class="pill">
                        Out of service
                    </button>

                    <button class="pill">
                        Retired
                    </button>

                </div>

                <small class="note">
                    pill = single-select
                </small>

            </div>

            <div class="section">

                <label>
                    Calibration due date
                </label>

                <input
                type="date"
                class="date">

            </div>

            <div class="buttons">

                <button class="cancel">
                    Cancel
                </button>

                <button class="save">
                    Save equipment
                </button>

            </div>

        </div>

    </main>

</div>

<script src="add-equipment-script.js"></script>

</body>
</html>

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
security.jwt.secret=${JWT_SECRET}

# Email (Module 7 - Email notifications / password reset)
# Free option: Gmail SMTP with a Google "App Password" (Google Account ->
# Security -> 2-Step Verification -> App passwords). Costs nothing, no
# Twilio/Firebase needed. If MAIL_USERNAME/MAIL_PASSWORD are left unset,
# EmailService just logs a warning and skips sending - the app still runs.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL of the frontend, used to build the password-reset link sent by email
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Email sending, in order of preference:
#  1. BREVO_API_KEY set  -> sends over HTTPS (port 443). This is the option
#     that works on Render's FREE plan, because Render blocks outbound
#     SMTP ports (25/465/587) on free instances.
#  2. MAIL_USERNAME/MAIL_PASSWORD set -> Gmail SMTP (only works locally or
#     on a paid Render instance).
#  3. neither set -> emails are only logged, the app still runs.
# MAIL_FROM is the sender address (must be verified in Brevo as a "sender").
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Lab Resource Utilization Platform}


# "Sign in with Google" (free). Leave GOOGLE_CLIENT_ID unset to switch the
# feature off - the normal email + password login keeps working.
app.google.client-id=${GOOGLE_CLIENT_ID:}